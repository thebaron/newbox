snap_packages:
  - name: google-cloud-cli
    classic: true
  - name: lxd
    classic: false

binaries:
  - name: go
    version: "1.25.7"
    check_cmd: /usr/local/go/bin/go
    check_version_cmd: "/usr/local/go/bin/go version | grep -oP '\\d+\\.\\d+\\.\\d+'"
    url: "https://golang.org/dl/go{{ version }}.linux-amd64.tar.gz"
    archive_type: tar.gz
    install_method: extract
    install_path: /usr/local
    pre_install: "sudo rm -rf /usr/local/go"
    post_install: "sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go"

  - name: awscli
    version: "2"
    check_cmd: aws
    check_version_cmd: "aws --version | grep -oP 'aws-cli/\\K[\\d.]+' | cut -d. -f1"
    url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
    archive_type: zip
    install_method: installer
    installer_cmd: "sudo {{ tmp_dir }}/aws/install --update"

  - name: eksctl
    version: latest
    check_cmd: eksctl
    url: "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
    archive_type: tar.gz
    install_method: binary
    install_path: /usr/local/bin/eksctl

  - name: kubebuilder
    version: "4.11.1"
    check_cmd: kubebuilder
    check_version_cmd: "kubebuilder version | grep -oP 'KubeBuilder:\\s+v[\\d.]+'|cut -d':' -f2 | sed -e 's/[^0-9.]//g'"
    url: "https://github.com/kubernetes-sigs/kubebuilder/releases/download/v{{ version }}/kubebuilder_linux_amd64"
    archive_type: binary
    install_method: binary
    install_path: /usr/local/bin/kubebuilder

  - name: kustomize
    version: "5.8.0"
    check_cmd: kustomize
    check_version_cmd: "kustomize version | grep -oP '\\d+\\.\\d+\\.\\d+'"
    url: "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv{{ version }}/kustomize_v{{ version }}_linux_amd64.tar.gz"
    archive_type: tar.gz
    install_method: binary
    install_path: /usr/local/bin/kustomize

  - name: cursor
    version: "latest"
    check_cmd: cursor
    check_version_cmd: cursor
    url: "https://downloader.cursor.sh/linux/appImage/x64"
    archive_type: binary
    install_method: installer
    installer_cmd: "sudo chmod +x {{ tmp_dir }}/x64; sudo mv {{ tmp_dir }}/x64 {{ tmp_dir }}/cursor.AppImage; sudo {{ tmp_dir }}/cursor.AppImage"

  - name: uv
    version: "0.10.0"
    check_cmd: uv
    check_version_cmd: "uv --version | grep -oP 'uv\\s+[\\d.]+' | cut -d' ' -f2"
    url: "https://astral.sh/uv/install.sh"
    archive_type: script
    script_env: UV_INSTALL_DIR=/usr/local/bin

  - name: ghostty
    version: "1.2.3"
    check_cmd: ghostty
    check_version_cmd: "ghostty --version | grep -oP 'Ghostty\\s+[\\d.]+' | cut -d' ' -f2"
    url: "https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh"
    archive_type: script

fonts:
  archives:
    - "../SF-Fourche.zip"
    - "../TTF-source-code-pro-2.038R-ro-1.058R-it.zip"
  target_dir: "{{ home }}/.local/share/fonts"

gnome_extensions:
  - uuid: "dash-to-dock@micxgx.gmail.com"
    name: "Dash to Dock"
  - uuid: "appindicatorsupport@rgcjonas.gmail.com"
    name: "AppIndicator Support"

dotfiles:
  source_dir: "{{ repo_root }}/dotfiles"
  target_dir: "{{ home }}"
