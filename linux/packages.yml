  - libgstreamer-plugins-bad1.0
  - libvirt-daemon-system
  - libvirt-clients
  - nfs-common
  - nodejs
  - p7zip
  - packer
  - podman
  - prettyping
  - pulseaudio-module-raop
  - pulseaudio-module-zeroconf
  - pwgen
  - qemu-kvm
  - ripgrep
  - screen
  - sqlite3
  - terraform
  - tmux
  - ulauncher
  - uxplay
  - vim
