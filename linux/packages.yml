# packages.yml - Central configuration for newbox Linux setup
# All modules read from this file via yq

prerequisites:
  - curl
  - wget
  - git
  - gnupg
  - apt-transport-https
  - ca-certificates
  - software-properties-common
  - flatpak
  - gnome-software-plugin-flatpak
  - unzip
  - build-essential

apt_repos:
  - name: hashicorp
    key_url: "https://apt.releases.hashicorp.com/gpg"
    key_path: "/usr/share/keyrings/hashicorp-archive-keyring.gpg"
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ codename }} main"
    list_file: "hashicorp.list"

  - name: helm
    key_url: "https://packages.buildkite.com/helm-linux/helm-debian/gpgkey"
    key_path: "/usr/share/keyrings/helm.gpg"
    repo: "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    list_file: "helm-stable-debian.list"

  - name: 1password
    key_url: "https://downloads.1password.com/linux/keys/1password.asc"
    key_path: "/usr/share/keyrings/1password-archive-keyring.gpg"
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main"
    list_file: "1password.list"
    extra_steps:
      - "sudo mkdir -p /etc/debsig/policies/AC2D62742012EA22/ /usr/share/debsig/keyrings/AC2D62742012EA22"
      - "curl -sS https://downloads.1password.com/linux/debian/debsig/1password.pol | sudo tee /etc/debsig/policies/AC2D62742012EA22/1password.pol > /dev/null"
      - "curl -sS https://downloads.1password.com/linux/keys/1password.asc | sudo gpg --dearmor --yes --output /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg"

  - name: gcp
    key_url: "https://packages.cloud.google.com/apt/doc/apt-key.gpg"
    key_path: "/usr/share/keyrings/cloud.google.gpg"
    repo: "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
    list_file: "google-cloud-sdk.list"

  - name: kubernetes
    key_url: "https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key"
    key_path: "/usr/share/keyrings/kubernetes-apt-keyring.gpg"
    repo: "deb [signed-by=/usr/share/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /"
    list_file: "kubernetes.list"

  - name: ppa-agornostal/ulauncher
    key_url: "keyserver://keyserver.ubuntu.com/0xfaf1020699503176"
    key_path: "/usr/share/keyrings/ulauncher-archive-keyring.gpg"
    repo: "deb [signed-by=/usr/share/keyrings/ulauncher-archive-keyring.gpg] http://ppa.launchpad.net/agornostal/ulauncher/ubuntu {{ codename }} main"
    list_file: "ulauncher.list"

apt_packages:
  - 1password
  - silversearcher-ag
  - aria2
  - bat
  - bridge-utils
  - containerd.io
  - cpu-checker
